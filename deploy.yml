---
- name: Deploy Dockerized app
  hosts: deploy_servers
  become: true
  vars:
    image_name: "shaiq1/devops-cicd-demo"
    container_name: "cicd-demo-app"

  tasks:
    - name: Ensure Docker is installed
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Pull latest image
      community.docker.docker_image:
        name: "{{ image_name }}:{{ image_tag | default('latest') }}"
        source: pull

    - name: Stop and remove old container if exists
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent

    - name: Run new container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}:{{ image_tag | default('latest') }}"
        state: started
        restart_policy: always
        ports:
          - "5000:5000"